name: LinkedIn Metrics Scraper

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9am UTC
  workflow_dispatch:     # Allow manual triggering

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: linkedin-scraper
        run: npm install

      - name: Install Playwright browsers
        working-directory: linkedin-scraper
        run: npx playwright install --with-deps chromium

      - name: Run LinkedIn metrics scraper
        run: node scripts/linkedin-metrics.js
        env:
          LINKEDIN_EMAIL: ${{ secrets.LINKEDIN_EMAIL }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}

      - name: Commit and push new metrics data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/metrics/
          if git diff --cached --quiet; then
            echo "No new data files to commit."
          else
            git commit -m "chore(metrics): add LinkedIn metrics $(date -u +'%Y-%m-%d')"
            git push
          fi
