name: LinkedIn Metrics Scraper

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9am UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Install Playwright browsers
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Run LinkedIn metrics scraper
        working-directory: scripts
        env:
          LINKEDIN_EMAIL: ${{ secrets.LINKEDIN_EMAIL }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
        run: node linkedin-metrics.js

      - name: Commit and push new metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/metrics/
          if git diff --cached --quiet; then
            echo "No new metrics to commit."
          else
            git commit -m "chore: add LinkedIn metrics $(date -u +%Y-%m-%d)"
            git push
          fi
