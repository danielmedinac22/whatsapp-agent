<title>Configuración de Sebastián</title>

<!--
  PROTOTIPO DESECHABLE — no es código de producción, no se integra.

  NIVEL 2 · grupo «configuración del vendedor». Encuadre del nivel 1 fijo.

  La pregunta del spec: separar visualmente lo que tiene CONSECUENCIA —el
  límite de descuento, que puede ponerse en cero para prohibirlos— de lo que
  es TONO, que es texto libre. «Ni todo estructurado, que es mucha UI a tarifa
  fija, ni todo libre, que deja que una edición del cliente rompa al vendedor
  sin que nadie se entere.»

  Lo que YA existe en producción (mirado antes de proponer, que es la lección
  de la bandeja):
  · agent-form.tsx son cuatro <section class="app-card"> apiladas con <h2>:
    Modelo de IA · Comportamiento y tiempos · Plantillas · Seguimiento Dropi.
  · prompt-card.tsx es una tarjeta APARTE con el prompt libre, historial de
    versiones y restaurar.
  O sea: el panel ya separa lo estructurado del texto libre. Lo que no tiene
  precedente es un campo que GASTA PLATA.

  Referencias (Mobbin):
  · Relevance AI — «Agent autonomy limit» + «When the limit is reached» con su
    acción. Un límite sin consecuencia declarada está incompleto.
  · Gorgias — tono con presets + texto libre + vista previa de la respuesta.
  · Sana AI, PlayAI — pestañas / pasos. Lindy, Linear — secciones apiladas.

  Nivel 1 en eee80a0 · conversaciones en 3e6c095 · catálogo en fcd3eec.
-->

<script>
const OPS = {
  GT:{code:"GT",name:"Guatemala",currency:"GTQ",cur:"Q",phone:"+502 3689 0343",store:"Vorare GT · Shopify",live:true,status:"Operando",accent:"#a78bfa"},
  CO:{code:"CO",name:"Colombia",currency:"COP",cur:"$",phone:"+57 304 5430173",store:"sin conectar",live:false,status:"Sin operar",accent:"#38bdf8"},

const MODULES = {
  ventas:{key:"ventas",label:"Ventas",agent:"Sebastián",
    screens:[{key:"vendedor",label:"Vendedor",icon:"◉"},{key:"catalogo",label:"Catálogo",icon:"▤"},{key:"conversaciones",label:"Conversaciones",icon:"◇"}]},
  confirmacion:{key:"confirmacion",label:"Confirmación",agent:"Katherine",
    screens:[{key:"agente",label:"Agente",icon:"◉"},{key:"inbox",label:"Inbox",icon:"✉"},{key:"pedidos",label:"Pedidos",icon:"▦"}]},

const TONES = {
  cercano:{t:"Cercano",d:"Tutea, directo, sin formalismos",
    txt:"Cercano y directo, sin tratar de usted. Responde en guatemalteco neutro. No prometas resultados médicos.",
    reply:"Claro que sí 😊 el tratamiento son 3 meses y sí funciona para entradas. ¿Te mando el precio con envío?"},
  formal:{t:"Formal",d:"Trata de usted, tono profesional",
    txt:"Trate al cliente de usted. Tono profesional y sobrio. No prometa resultados médicos.",
    reply:"Buenas tardes. El tratamiento tiene una duración de 3 meses y está indicado para entradas. ¿Desea que le comparta el precio con envío?"},
  custom:{t:"Propio",d:"Escribilo vos",
    txt:"Cercano pero sin exagerar. Usa «vos». Si preguntan por envío, confirma contraentrega en toda Guatemala. Si piden descuento más allá del límite, no inventes: decí que consultás.",
    reply:"Sí, sirve para entradas. El tratamiento son 3 meses y te llega contraentrega a toda Guatemala. ¿Te paso el precio?"},

const WHEN = [
  {k:"consulta", t:"Consultar con una persona",  d:"Sebastián deja de negociar y escala el chat. Es lo que el cliente ve como «déjame confirmar»."},
  {k:"tope",     t:"Ofrecer el máximo y cerrar", d:"Aplica el límite y sigue empujando al cierre sin escalar."},
  {k:"nada",     t:"No mencionar descuentos",    d:"Ignora el pedido y vuelve al valor del producto."},
];

const VARIANTS = [
  {id:"A",label:"Secciones apiladas",  tag:"la anatomía de Katherine: tarjetas con h2",           ref:"agent-form.tsx · Lindy"},
  {id:"B",label:"Consecuencia | tono", tag:"dos columnas: lo que actúa, lo que suena",            ref:"separación física"},
  {id:"C",label:"El límite arriba",    tag:"el guardarraíl primero, con su consecuencia",         ref:"Relevance AI"},
  {id:"D",label:"Presets con preview", tag:"el tono se elige y se ve respondido",                 ref:"Gorgias"},
  {id:"E",label:"Pestañas",            tag:"Persona · Límites · Mensajes",                        ref:"Sana AI · PlayAI"},
];

const state = { variant:0, country:"GT", module:"ventas", screen:"vendedor", bars:"open",
                limit:"10", tone:"cercano", when:"consulta", tab:"persona" };

const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const flag=(c,s)=>`<span class="flag flag-${c}${s?" flag-"+s:""}"></span>`;
const op=()=>OPS[state.country];
const mod=()=>MODULES[state.module];
const V=()=>VARIANTS[state.variant];
function rgba(h,a){const n=parseInt(h.slice(1),16);return `rgba(${(n>>16)&255}, ${(n>>8)&255}, ${n&255}, ${a})`;}
const zero = () => state.limit === "0";

/* ---------- las piezas ---------- */

/* El bloque que gasta plata. Relevance AI enseñó que un límite sin su
   consecuencia declarada está incompleto: falta qué hace el agente al tope. */
function guardBlock(bare) {
  const box = el("div", bare ? "" : "card sec guard");
  if (bare) box.className = "";
  box.appendChild(el("div","sec-h",
    `<span class="sec-t">Límite de descuento</span>
     <span class="guard-badge">tiene consecuencia</span>`));

  const lim = el("div","limit");
  const inp = el("input","limit-in" + (zero() ? " zero" : ""));
  inp.value = state.limit; inp.readOnly = true;
  lim.appendChild(inp);
  lim.appendChild(el("div","limit-eq", zero()
    ? `<strong>Los descuentos están prohibidos.</strong> Sebastián no puede bajar el precio
       ni un quetzal, en ninguna conversación.`
    : `Sebastián puede llegar hasta <strong>${state.limit}%</strong> por su cuenta —
       hasta <strong>${op().cur} ${(349*0.10).toFixed(0)}</strong> sobre el producto de ${op().cur} 349.
       Poné <strong>0</strong> para prohibirlos.`));
  box.appendChild(lim);

  const when = el("div","when");
  when.appendChild(el("div","when-k", zero()
    ? "Cuando el cliente insista con un descuento"
    : `Cuando el cliente pida más de ${state.limit}%`));
  WHEN.forEach(w => {
    const b = el("button","opt");
    b.setAttribute("aria-pressed", String(state.when === w.k));
    b.innerHTML = `<span class="opt-r"></span>
      <span><span class="opt-t">${esc(w.t)}</span><span class="opt-d">${esc(w.d)}</span></span>`;
    b.onclick = () => { state.when = w.k; render(); };
    when.appendChild(b);
  });
  box.appendChild(when);
  return box;
}

function toneBlock(opts = {}) {
  const box = el("div", opts.bare ? "" : "card sec");
  box.appendChild(el("div","sec-h",
    `<span class="sec-t">Tono e instrucciones</span>
     <span class="sec-d">no tiene consecuencia · cambia cómo suena</span>`));

  if (opts.presets) {
    const g = el("div","presets");
    Object.entries(TONES).forEach(([k,t]) => {
      const b = el("button","preset");
      b.setAttribute("aria-pressed", String(state.tone === k));
      b.innerHTML = `<div class="preset-t">${esc(t.t)}</div><div class="preset-d">${esc(t.d)}</div>`;
      b.onclick = () => { state.tone = k; render(); };
      g.appendChild(b);
    });
    box.appendChild(g);
  }

  const f = el("div","fld");
  f.innerHTML = `<span class="fld-k">Instrucciones</span>`;
  const ta = el("textarea","ta"); ta.rows = 4; ta.value = TONES[state.tone].txt;
  f.appendChild(ta);
  f.appendChild(el("span","fld-h","Texto libre. Aplica en la próxima conversación, sin desplegar."));
  box.appendChild(f);

  if (opts.history) {
    const h = el("div","fld");
    h.innerHTML = `<span class="fld-k" style="margin-bottom:4px">Historial</span>
      <div class="hist"><span class="muted">Hoy 14:20 · Daniel</span><span class="soft">en uso</span></div>
      <div class="hist"><span class="muted">15 ago · Daniel</span><button class="btn" style="padding:3px 9px;font-size:11px">restaurar</button></div>`;
    box.appendChild(h);
  }
  return box;
}

function previewBlock() {
  const box = el("div","prev");
  box.appendChild(el("div","prev-k","Así responde Sebastián"));
  box.innerHTML += `<div class="bub bub-in">¿Sirve para entradas? tengo 34 años</div>
    <div class="bub bub-out">${esc(TONES[state.tone].reply)}</div>
    <div class="bub bub-in">¿Me hacés un 20%?</div>
    <div class="bub bub-out">${esc(
      zero() ? "El precio es fijo, no manejamos descuentos. Pero te incluyo el envío sin costo 😉"
      : state.when === "consulta" ? `Puedo llegar hasta ${state.limit}% por mi cuenta. Dejame consultar si podemos hacer algo más y te confirmo.`
      : state.when === "tope" ? `Te puedo dejar el ${state.limit}%, es lo máximo. ¿Te lo aparto?`
      : "Te cuento que el tratamiento rinde 3 meses, así que el costo por día es bajísimo. ¿Te lo aparto?")}</div>`;
  return box;
}

function identityBlock(bare) {
  const box = el("div", bare ? "" : "card sec");
  box.appendChild(el("div","sec-h",`<span class="sec-t">Identidad</span>
    <span class="sec-d">lo que el cliente ve</span>`));
  const r = el("div","row2");
  r.innerHTML = `<div class="fld"><span class="fld-k">Nombre visible</span>
      <input class="inp" value="Sebastián"></div>
    <div class="fld"><span class="fld-k">Número que responde</span>
      <input class="inp num" value="${esc(op().phone)}" readonly></div>`;
  box.appendChild(r);
  return box;
}

function messagesBlock(bare) {
  const box = el("div", bare ? "" : "card sec");
  box.appendChild(el("div","sec-h",`<span class="sec-t">Mensajes base</span>
    <span class="sec-d">los momentos clave</span>`));
  [["Saludo","¡Hola! Soy Sebastián de Vorare 👋 ¿En qué te ayudo?"],
   ["Empuje al cierre","¿Te lo aparto? Pagás cuando lo recibís."],
   ["Mensaje de embudo","Te dejo el enlace por si querés verlo con calma."]].forEach(([k,v]) => {
    const f = el("div","fld");
    f.innerHTML = `<span class="fld-k">${esc(k)}</span>`;
    const i = el("input","inp"); i.value = v; f.appendChild(i);
    box.appendChild(f);
  });
  return box;
}

const saveBar = () => {
  const b = el("div","savebar");
  b.innerHTML = `<span>Los cambios aplican en la próxima conversación, sin desplegar.</span>`;
  b.appendChild(el("button","btn","Descartar"));
  b.appendChild(el("button","btn btn-p","Guardar"));
  return b;
};

/* ================= LAS CINCO ================= */

function vA() { // secciones apiladas — la anatomía de Katherine
  const w = el("div");
  w.appendChild(identityBlock());
  w.appendChild(messagesBlock());
  w.appendChild(guardBlock());
  w.appendChild(toneBlock({ history:true }));
  w.appendChild(saveBar());
  return w;
}

function vB() { // dos columnas: lo que actúa | lo que suena
  const w = el("div");
  const g = el("div");
  g.style.cssText = "display:grid;grid-template-columns:1fr 1fr;gap:13px;align-items:start";
  const L = el("div"), R = el("div");
  L.appendChild(el("div","grouplabel","Lo que Sebastián puede hacer"));
  const sp = el("div"); sp.style.height="8px"; L.appendChild(sp);
  L.appendChild(identityBlock());
  L.appendChild(guardBlock());
  R.appendChild(el("div","grouplabel","Cómo suena"));
  const sp2 = el("div"); sp2.style.height="8px"; R.appendChild(sp2);
  R.appendChild(toneBlock({ presets:true }));
  R.appendChild(messagesBlock());
  g.appendChild(L); g.appendChild(R);
  w.appendChild(g);
  w.appendChild(saveBar());
  return w;
}

function vC() { // el guardarraíl primero
  const w = el("div");
  w.appendChild(guardBlock());
  w.appendChild(identityBlock());
  w.appendChild(messagesBlock());
  w.appendChild(toneBlock({ history:true }));
  w.appendChild(saveBar());
  return w;
}

function vD() { // presets + vista previa en vivo
  const w = el("div");
  const g = el("div");
  g.style.cssText = "display:grid;grid-template-columns:1fr 340px;gap:13px;align-items:start";
  const L = el("div");
  L.appendChild(identityBlock());
  L.appendChild(guardBlock());
  L.appendChild(toneBlock({ presets:true }));
  L.appendChild(messagesBlock());
  const R = el("div");
  R.style.cssText = "position:sticky;top:16px";
  R.appendChild(previewBlock());
  g.appendChild(L); g.appendChild(R);
  w.appendChild(g);
  w.appendChild(saveBar());
  return w;
}

function vE() { // pestañas
  const w = el("div");
  const tabs = el("div","tabs");
  [["persona","Persona",false],["limites","Límites",true],["mensajes","Mensajes",false]].forEach(([k,l,danger]) => {
    const b = el("button","tab" + (danger ? " danger" : ""), l);
    b.setAttribute("aria-selected", String(state.tab === k));
    b.onclick = () => { state.tab = k; render(); };
    tabs.appendChild(b);
  });
  w.appendChild(tabs);
  if (state.tab === "persona") { w.appendChild(identityBlock()); w.appendChild(toneBlock({presets:true, history:true})); }
  else if (state.tab === "limites") w.appendChild(guardBlock());
  else w.appendChild(messagesBlock());
  w.appendChild(saveBar());
  return w;
}

const VIEW = { A:vA, B:vB, C:vC, D:vD, E:vE };

function vendorScreen() {
  const w = el("div");
  w.appendChild(el("div","page-head",`
    <span class="eyebrow">${esc(op().name)} · vendedor</span>
    <h2 class="page-title">Configuración de Sebastián</h2>
    <p class="page-sub">Lo que tiene consecuencia se separa de lo que es tono. Los cambios aplican
      en la próxima conversación, sin desplegar.</p>`));
  w.appendChild(VIEW[V().id]());
  return w;
}

function otherScreen(t,s,m) {
  const w = el("div");
  w.appendChild(el("div","page-head",`<span class="eyebrow">${esc(op().name)} · ${esc(t.toLowerCase())}</span>
    <h2 class="page-title">${esc(t)}</h2><p class="page-sub">${esc(s)}</p>`));
  const c = el("div","card");
  c.innerHTML = `<div style="padding:50px 24px;text-align:center">
    <div style="width:46px;height:46px;border-radius:11px;border:1px dashed var(--border-strong);display:grid;place-items:center;color:var(--text-soft);margin:0 auto 10px">${m}</div>
    <p class="soft" style="font-size:12.5px;max-width:44ch;margin:0 auto;line-height:1.55">Está aquí para ver el marco alrededor.</p></div>`;
  w.appendChild(c);
  return w;
}

function content() {
  if (state.screen === "vendedor") return vendorScreen();
  if (state.screen === "agente") return otherScreen("Agente","La configuración de Katherine, tal como existe hoy: cuatro secciones apiladas más la tarjeta del prompt.","◉");
  if (state.screen === "catalogo") return otherScreen("Catálogo","Tabla densa, ya decidida.","▤");
  if (state.screen === "conversaciones") return otherScreen("Conversaciones","Bandeja de Sebastián, ya decidida.","◇");
  if (state.screen === "pedidos") return otherScreen("Pedidos","Confirmación de pedidos.","▦");
  return otherScreen("Inbox","Bandeja de Katherine.","✉");
}

/* ---------------- armazón ---------------- */
const toggleBars = () => { state.bars = state.bars === "open" ? "collapsed" : "open"; render(); };
function switchCountry(c){ if(state.country===c) return; state.country=c; state.bars="open"; render(); }

function navFor(m) {
  const box = el("div");
  box.style.cssText = "display:flex;flex-direction:column;gap:2px";
  MODULES[m].screens.forEach(s => {
    const b = el("button","navlink",`<span class="ico">${s.icon}</span>${esc(s.label)}`);
    if (state.screen === s.key && state.module === m) b.setAttribute("aria-current","page");
    b.onclick = () => { state.module = m; state.screen = s.key; render(); };
    box.appendChild(b);
  });
  return box;
}
function buildRail(tight) {
  const rail = el("div","rail"+(tight?" tight":""));
  Object.values(OPS).forEach(x => {
    const t = el("button","tile"+(x.live?"":" dormant"),`${flag(x.code)}${tight?"":`<span class="tile-code">${esc(x.code)}</span>`}`);
    t.setAttribute("aria-pressed", String(state.country===x.code));
    t.title = `${x.name} · ${x.status}`;
    t.onclick = () => switchCountry(x.code);
    rail.appendChild(t);
  });
  if (tight) {
    const sep = el("div"); sep.style.cssText="width:20px;height:1px;background:var(--border);margin:3px 0"; rail.appendChild(sep);
    mod().screens.forEach(s => {
      const b = el("button","strip-ico",s.icon);
      b.title = `${mod().label} · ${s.label}`;
      if (state.screen === s.key) b.setAttribute("aria-current","page");
      b.onclick = () => { state.screen = s.key; render(); };
      rail.appendChild(b);
    });
  }
  const f = el("button","fold", state.bars==="open"?"«":"»");
  f.style.marginTop="auto"; f.onclick=toggleBars; rail.appendChild(f);
  return rail;
}
function buildCol() {
  const o = op(), col = el("div","col");
  const head = el("div","col-head");
  head.innerHTML = `${flag(o.code,"lg")}<span style="min-width:0">
    <span class="col-name">${esc(o.name)}</span>
    <span class="col-sub">${esc(o.status)} · ${esc(o.currency)}</span>
    <span class="col-tel${o.live?"":" off"}">${esc(o.phone)}</span></span>`;
  const f = el("button","fold","«"); f.onclick = toggleBars; head.appendChild(f);
  col.appendChild(head);
  ["ventas","confirmacion"].forEach(k => {
    const m = MODULES[k];
    const g = el("div","group"+(state.module===k?" on":""));
    g.appendChild(el("div","group-head",`<span class="grouplabel">${esc(m.label)}</span>
      <span class="soft" style="font-size:11px">${esc(m.agent)}</span>`));
    const items = el("div","group-items"); items.appendChild(navFor(k)); g.appendChild(items);
    col.appendChild(g);
  });
  col.appendChild(el("div","colfoot",`<div class="soft" style="font-size:11px;line-height:1.5">${esc(o.store)}</div>`));
  return col;
}

function render() {
  const hex = op().accent, root = document.documentElement.style;
  root.setProperty("--op",hex);
  root.setProperty("--op-line",rgba(hex,.45));
  root.setProperty("--op-soft",rgba(hex,.13));
  root.setProperty("--op-faint",rgba(hex,.07));
  if (!mod().screens.some(s => s.key === state.screen)) state.screen = mod().screens[0].key;

  const shell = el("div","shell");
  const open = state.bars === "open";
  shell.style.gridTemplateColumns = open ? "78px 216px 1fr" : "46px 1fr";
  shell.appendChild(buildRail(!open));
  if (open) shell.appendChild(buildCol());
  const main = el("div","main"), page = el("div","page");
  page.appendChild(content()); main.appendChild(page); shell.appendChild(main);
  const app = document.getElementById("app");
  app.innerHTML=""; app.appendChild(shell);
  syncPicker();
}

function syncPicker() {
  const v = V();
  document.getElementById("pk-vnum").textContent = `${state.variant+1} de 5 · ${v.id}`;
  document.getElementById("pk-vlabel").textContent = v.label;
  document.getElementById("pk-vtag").textContent = v.tag;
  document.getElementById("pk-ref").textContent = "ref: " + v.ref;
  document.querySelectorAll(".pk-opts[data-key]").forEach(g => {
    g.querySelectorAll(".pk-opt").forEach(b => b.setAttribute("aria-pressed", String(state[g.dataset.key] === b.dataset.val)));
  });
}
document.querySelectorAll('.pk-opts[data-key]').forEach(g => {
  g.querySelectorAll(".pk-opt").forEach(b => {
    b.onclick = () => {
      const k = g.dataset.key;
      if (k === "country") { switchCountry(b.dataset.val); return; }
      state[k] = b.dataset.val;
      render();
    };
  });
});
function step(d){ state.variant=(state.variant+d+VARIANTS.length)%VARIANTS.length; render(); }
document.getElementById("pk-prev").onclick = () => step(-1);
document.getElementById("pk-next").onclick = () => step(1);
document.getElementById("pk-min").onclick = () => document.getElementById("picker").classList.toggle("is-min");
addEventListener("keydown", e => {
  if (e.target.closest("input, textarea")) return;
  if (e.key === "ArrowLeft") { step(-1); e.preventDefault(); }
  if (e.key === "ArrowRight") { step(1); e.preventDefault(); }
});
(function drag(){
  const box=document.getElementById("picker"), head=document.getElementById("pk-head");
  let dx=0,dy=0,on=false;
  head.addEventListener("mousedown",e=>{
    if(e.target.closest("button"))return;
    on=true; const r=box.getBoundingClientRect();
    dx=e.clientX-r.left; dy=e.clientY-r.top;
    box.style.right="auto"; box.style.bottom="auto";
    box.style.left=r.left+"px"; box.style.top=r.top+"px"; e.preventDefault();
  });
  addEventListener("mousemove",e=>{
    if(!on)return;
    box.style.left=Math.min(Math.max(0,e.clientX-dx),innerWidth-box.offsetWidth)+"px";
    box.style.top=Math.min(Math.max(0,e.clientY-dy),innerHeight-box.offsetHeight)+"px";
  });
  addEventListener("mouseup",()=>{on=false;});
})();
render();
</script>
