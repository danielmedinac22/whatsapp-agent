<title>Tablero del recorrido</title>

<!--
  PROTOTIPO DESECHABLE — no es código de producción, no se integra.

  NIVEL 2 · último grupo: el tablero de pipeline. Lo agregó Daniel al
  preguntar si hacía falta un visualizador tipo CRM; se evaluó dejarlo fuera
  del spec y decidió incluirlo.

  Lo que lo hace distinto de un CRM normal, y debería condicionar la forma:
  · Las seis etapas son DERIVADAS y automáticas. Nadie arrastra nada — igual
    que el Salesbot de Kommo, que mueve el lead solo. Un tablero con drag
    mentiría sobre quién mueve las tarjetas.
  · No es una herramienta de repartir trabajo: Vorare es un operador con dos
    agentes, y el reparto ya lo hace el ruteo.
  · Su trabajo real es ver DÓNDE SE CAE el 11,6% que no confirma. Hoy el
    recorrido vive partido en tres pantallas y nadie ve el viaje completo.

  Tensión declarada: el spec excluye «reportería y analítica de ventas», y un
  embudo es eso. Las cinco variantes mantienen cada etapa como lista de leads
  sobre los que se puede actuar, no como gráfico.

  Referencias (Mobbin):
  · Attio, Twenty — tablero de columnas por etapa con tarjetas.
  · Squarespace — la conversión va ENTRE las barras, no dentro.
  · Hotjar — nombra la caída explícitamente («dropped off»), con conteo y %.

  Nivel 1 en eee80a0 · conversaciones 3e6c095 · catálogo fcd3eec · vendedor 874687a
-->

const VARIANTS = [
  {id:"A",label:"Columnas",           tag:"el tablero canónico, sin arrastrar",             ref:"Attio · Twenty"},
  {id:"B",label:"Embudo con caída",   tag:"la conversión va entre las barras",              ref:"Squarespace · Hotjar"},
  {id:"C",label:"Lista con bandas",   tag:"un solo scroll, la etapa como banda",            ref:"lo ya decidido"},
  {id:"D",label:"Carriles por país",  tag:"etapas × operaciones, para cuando Colombia abra",ref:"swimlanes"},
  {id:"E",label:"Atascados",          tag:"no dónde están: hace cuánto que no se mueven",   ref:"detector de estancamiento"},
];

const state = { variant:0, period:"mes", country:"GT", module:"ventas", screen:"tablero", bars:"open", stage:2 };

const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const flag=(c,s)=>`<span class="flag flag-${c}${s?" flag-"+s:""}"></span>`;
const op=()=>OPS[state.country];
const mod=()=>MODULES[state.module];
const V=()=>VARIANTS[state.variant];
function rgba(h,a){const n=parseInt(h.slice(1),16);return `rgba(${(n>>16)&255}, ${(n>>8)&255}, ${n&255}, ${a})`;}

const vol = () => VOL[state.country][state.period];
const leadsAt = i => LEADS[state.country].filter(l => l.s === i);
/* La caída entre dos etapas. Es el número que el tablero existe para mostrar. */
const conv = i => { const v = vol(); return v[i-1] ? Math.round(v[i]/v[i-1]*100) : 0; };
const worstStep = () => {
  let w = 1, min = 101;
  for (let i=1;i<STAGES.length;i++){ const c = conv(i); if (vol()[i-1] && c < min) { min = c; w = i; } }
  return w;
};

const autoNote = () => el("div","auto",
  `<span>⟳</span><span><strong>El recorrido se mueve solo.</strong> Las seis etapas se derivan del
   reconocimiento, del pedido y de la confirmación — nadie arrastra tarjetas. Este tablero
   se mira para decidir dónde intervenir, no para mover a nadie.</span>`);

function leadCard(l) {
  const b = el("button","lead");
  b.innerHTML = `<div class="lead-n">${esc(l.n)}</div>
    <div class="lead-m ${l.warn||l.bad?"lead-stall":""}">${esc(l.note)}${l.d>2?` · ${l.d} d`:""}</div>`;
  return b;
}

/* ================= LAS CINCO ================= */

function tA() {
  const w = el("div"); w.appendChild(autoNote());
  const b = el("div","board");
  const worst = worstStep();
  STAGES.forEach((s,i) => {
    const lane = el("div","card lane");
    const ls = leadsAt(i);
    lane.appendChild(el("div","lane-h",
      `<div class="lane-n" style="color:${i===STAGES.length-1?"var(--accent)":"var(--text-dim)"}">${esc(s)}</div>
       <div class="lane-c num">${vol()[i]}</div>`));
    const body = el("div","lane-b");
    ls.slice(0,3).forEach(l => body.appendChild(leadCard(l)));
    if (!ls.length) body.appendChild(el("div","more","—"));
    else if (vol()[i] > ls.length) body.appendChild(el("div","more",`+${vol()[i]-ls.slice(0,3).length} más`));
    lane.appendChild(body);
    if (i > 0) lane.appendChild(el("div","drop" + (i===worst?" bad":""), `${conv(i)}%`));
    b.appendChild(lane);
  });
  w.appendChild(b);
  return w;
}

function tB() {
  const w = el("div"); w.appendChild(autoNote());
  const c = el("div","card");
  const f = el("div","funnel");
  const max = vol()[0] || 1, worst = worstStep();
  STAGES.forEach((s,i) => {
    const st = el("div","fstep");
    const bar = el("div","fbar" + (state.stage===i?" sel":""));
    bar.style.height = Math.max(6, Math.round(vol()[i]/max*170)) + "px";
    st.appendChild(bar);
    st.appendChild(el("div","fn",esc(s)));
    st.appendChild(el("div","fv num",vol()[i]));
    if (i>0) st.appendChild(el("div","fdrop"+(i===worst?" bad":""),`${conv(i)}%`));
    st.style.cursor="pointer";
    st.onclick = () => { state.stage = i; render(); };
    f.appendChild(st);
  });
  c.appendChild(f);
  const ls = leadsAt(state.stage);
  c.appendChild(el("div","band",
    `<span class="dot" style="background:var(--op)"></span>
     <span class="band-n">${esc(STAGES[state.stage])}</span>
     <span class="band-c">${vol()[state.stage]} leads</span>`));
  if (!ls.length) c.appendChild(el("div","more",`<div style="padding:16px 14px">Ninguno para mostrar en este período.</div>`));
  ls.forEach(l => {
    const r = el("button","lrow");
    r.innerHTML = `<div><div class="lead-n">${esc(l.n)}</div>
        <div class="lead-m num">${esc(l.tel)}</div></div>
      <span class="lead-m ${l.warn||l.bad?"lead-stall":""}">${esc(l.note)}</span>
      <span class="lead-m num">${l.d} d</span>`;
    c.appendChild(r);
  });
  w.appendChild(c);
  return w;
}

function tC() {
  const w = el("div"); w.appendChild(autoNote());
  const c = el("div","card"); c.style.overflow="hidden";
  const worst = worstStep();
  STAGES.forEach((s,i) => {
    c.appendChild(el("div","band",
      `<span class="dot" style="background:${i===worst?"var(--danger)":"var(--op)"}"></span>
       <span class="band-n" style="color:${i===worst?"var(--danger)":"var(--text-dim)"}">${esc(s)}</span>
       ${i>0?`<span class="lead-m">${conv(i)}% de los anteriores</span>`:""}
       <span class="band-c">${vol()[i]}</span>`));
    leadsAt(i).forEach(l => {
      const r = el("button","lrow");
      r.innerHTML = `<div><div class="lead-n">${esc(l.n)}</div>
          <div class="lead-m num">${esc(l.tel)}</div></div>
        <span class="lead-m ${l.warn||l.bad?"lead-stall":""}">${esc(l.note)}</span>
        <span class="lead-m num">${l.d} d</span>`;
      c.appendChild(r);
    });
  });
  w.appendChild(c);
  return w;
}

function tD() {
  const w = el("div"); w.appendChild(autoNote());
  const c = el("div","card"); c.style.padding="13px";
  const head = el("div","swim");
  head.appendChild(el("div",null,""));
  STAGES.forEach(s => head.appendChild(el("div","lane-n",
    `<div style="padding:0 4px 4px;color:var(--text-soft)">${esc(s)}</div>`)));
  c.appendChild(head);
  Object.values(OPS).forEach(o => {
    const row = el("div","swim");
    row.appendChild(el("div","swim-h",
      `${flag(o.code,"sm")}<span><span class="swim-n">${esc(o.name)}</span>
       <span style="display:block;font-size:9.5px;color:var(--text-soft)">${esc(o.status)}</span></span>`));
    const v = VOL[o.code][state.period];
    v.forEach((n,i) => row.appendChild(el("div","cellv"+(n?"":" zero"),
      `<b>${n}</b><span>${i>0&&v[i-1]?Math.round(n/v[i-1]*100)+"%":"—"}</span>`)));
    c.appendChild(row);
  });
  w.appendChild(c);
  return w;
}

function tE() {
  const w = el("div"); w.appendChild(autoNote());
  const c = el("div","card"); c.style.overflow="hidden";
  /* «Sin moverse» son los que llevan al menos un día en la misma etapa. Los
     de hoy no están atascados: están pasando. */
  const activos = [...LEADS[state.country]].filter(l => l.s < 5);
  const ls = activos.filter(l => l.d >= 1).sort((a,b) => b.d - a.d);
  const frescos = activos.length - ls.length;
  c.appendChild(el("div","band",
    `<span class="dot" style="background:var(--danger)"></span>
     <span class="band-n">Sin moverse</span>
     <span class="lead-m">al menos un día en la misma etapa</span>
     <span class="band-c">${ls.length}</span>`));
  if (!ls.length) {
    c.appendChild(el("div","empty",`<div class="empty-mark">✓</div>
      <p class="soft" style="font-size:12.5px">Nada atascado en ${esc(op().name)}.</p>`));
  }
  ls.forEach(l => {
    const cls = l.d >= 6 ? "hot" : l.d >= 3 ? "warm" : "ok";
    const r = el("button","stall");
    r.innerHTML = `<span class="days ${cls}">${l.d}<small>días</small></span>
      <div><div class="lead-n" style="font-size:13px">${esc(l.n)}</div>
        <div class="lead-m num">${esc(l.tel)} · ${esc(l.note)}</div></div>
      <span class="where">${esc(STAGES[l.s])}</span>
      <span class="lead-m">→</span>`;
    c.appendChild(r);
  });
  if (frescos) c.appendChild(el("div","more",
    `<div style="padding:11px 14px;border-top:1px solid var(--border)">
       ${frescos} lead${frescos>1?"s":""} más se movieron hoy — esos van bien.</div>`));
  w.appendChild(c);
  return w;
}

const T = { A:tA, B:tB, C:tC, D:tD, E:tE };

function boardScreen() {
  const w = el("div");
  const v = vol(), worst = worstStep();
  w.appendChild(el("div","page-head",`
    <span class="eyebrow">${esc(op().name)} · recorrido</span>
    <h2 class="page-title">Recorrido de los leads</h2>
    <p class="page-sub">${op().live
      ? `De ${v[0]} clics en anuncios este mes llegaron ${v[5]} entregas. La caída más grande
         está en <strong>${esc(STAGES[worst-1])} → ${esc(STAGES[worst])}</strong>.`
      : "Esta operación todavía no vende: el recorrido está vacío después de la conversación."}</p>`));
  w.appendChild(T[V().id]());
  return w;
}

function otherScreen(t,s,m) {
  const w = el("div");
  w.appendChild(el("div","page-head",`<span class="eyebrow">${esc(op().name)} · ${esc(t.toLowerCase())}</span>
    <h2 class="page-title">${esc(t)}</h2><p class="page-sub">${esc(s)}</p>`));
  const c = el("div","card");
  c.appendChild(el("div","empty",`<div class="empty-mark">${m}</div>
    <p class="soft" style="font-size:12.5px;max-width:44ch;line-height:1.55">Ya decidido en una ronda anterior.</p>`));
  w.appendChild(c);
  return w;
}

function content() {
  if (state.screen === "tablero") return boardScreen();
  if (state.screen === "conversaciones") return otherScreen("Conversaciones","Bandeja de Sebastián.","◇");
  if (state.screen === "catalogo") return otherScreen("Catálogo","Tabla densa.","▤");
  if (state.screen === "vendedor") return otherScreen("Vendedor","Configuración de Sebastián.","◉");
  if (state.screen === "pedidos") return otherScreen("Pedidos","Confirmación de pedidos.","▦");
  return otherScreen("Inbox","Bandeja de Katherine.","✉");
}

/* armazón */
const toggleBars = () => { state.bars = state.bars === "open" ? "collapsed" : "open"; render(); };
function switchCountry(c){ if(state.country===c) return; state.country=c; state.bars="open"; state.stage=2; render(); }
function navFor(m) {
  const box = el("div");
  box.style.cssText = "display:flex;flex-direction:column;gap:2px";
  MODULES[m].screens.forEach(s => {
    const b = el("button","navlink",`<span class="ico">${s.icon}</span>${esc(s.label)}`);
    if (state.screen === s.key && state.module === m) b.setAttribute("aria-current","page");
    b.onclick = () => { state.module = m; state.screen = s.key; render(); };
    box.appendChild(b);
  });
  return box;
}
function buildRail(tight) {
  const rail = el("div","rail"+(tight?" tight":""));
  Object.values(OPS).forEach(x => {
    const t = el("button","tile"+(x.live?"":" dormant"),`${flag(x.code)}${tight?"":`<span class="tile-code">${esc(x.code)}</span>`}`);
    t.setAttribute("aria-pressed", String(state.country===x.code));
    t.title = `${x.name} · ${x.status}`;
    t.onclick = () => switchCountry(x.code);
    rail.appendChild(t);
  });
  if (tight) {
    const sep = el("div"); sep.style.cssText="width:20px;height:1px;background:var(--border);margin:3px 0"; rail.appendChild(sep);
    mod().screens.forEach(s => {
      const b = el("button","strip-ico",s.icon);
      b.title = `${mod().label} · ${s.label}`;
      if (state.screen === s.key) b.setAttribute("aria-current","page");
      b.onclick = () => { state.screen = s.key; render(); };
      rail.appendChild(b);
    });
  }
  const f = el("button","fold", state.bars==="open"?"«":"»");
  f.style.marginTop="auto"; f.onclick=toggleBars; rail.appendChild(f);
  return rail;
}
function buildCol() {
  const o = op(), col = el("div","col");
  const head = el("div","col-head");
  head.innerHTML = `${flag(o.code,"lg")}<span style="min-width:0">
    <span class="col-name">${esc(o.name)}</span>
    <span class="col-sub">${esc(o.status)} · ${esc(o.currency)}</span>
    <span class="col-tel${o.live?"":" off"}">${esc(o.phone)}</span></span>`;
  const f = el("button","fold","«"); f.onclick = toggleBars; head.appendChild(f);
  col.appendChild(head);
  ["ventas","confirmacion"].forEach(k => {
    const m = MODULES[k];
    const g = el("div","group"+(state.module===k?" on":""));
    g.appendChild(el("div","group-head",`<span class="grouplabel">${esc(m.label)}</span>
      <span class="soft" style="font-size:11px">${esc(m.agent)}</span>`));
    const items = el("div","group-items"); items.appendChild(navFor(k)); g.appendChild(items);
    col.appendChild(g);
  });
  col.appendChild(el("div","colfoot",`<div class="soft" style="font-size:11px;line-height:1.5">${esc(o.store)}</div>`));
  return col;
}
function render() {
  const hex = op().accent, root = document.documentElement.style;
  root.setProperty("--op",hex);
  root.setProperty("--op-line",rgba(hex,.45));
  root.setProperty("--op-soft",rgba(hex,.13));
  root.setProperty("--op-faint",rgba(hex,.07));
  if (!mod().screens.some(s => s.key === state.screen)) state.screen = mod().screens[0].key;
  const shell = el("div","shell");
  const open = state.bars === "open";
  shell.style.gridTemplateColumns = open ? "78px 216px 1fr" : "46px 1fr";
  shell.appendChild(buildRail(!open));
  if (open) shell.appendChild(buildCol());
  const main = el("div","main"), page = el("div","page");
  page.appendChild(content()); main.appendChild(page); shell.appendChild(main);
  const app = document.getElementById("app");
  app.innerHTML=""; app.appendChild(shell);
  syncPicker();
}
function syncPicker() {
  const v = V();
  document.getElementById("pk-vnum").textContent = `${state.variant+1} de 5 · ${v.id}`;
  document.getElementById("pk-vlabel").textContent = v.label;
  document.getElementById("pk-vtag").textContent = v.tag;
  document.getElementById("pk-ref").textContent = "ref: " + v.ref;
  document.querySelectorAll(".pk-opts[data-key]").forEach(g => {
    g.querySelectorAll(".pk-opt").forEach(b => b.setAttribute("aria-pressed", String(state[g.dataset.key] === b.dataset.val)));
  });
}
document.querySelectorAll('.pk-opts[data-key]').forEach(g => {
  g.querySelectorAll(".pk-opt").forEach(b => {
    b.onclick = () => {
      const k = g.dataset.key;
      if (k === "country") { switchCountry(b.dataset.val); return; }
      state[k] = b.dataset.val; render();
    };
  });
});
function step(d){ state.variant=(state.variant+d+VARIANTS.length)%VARIANTS.length; render(); }
document.getElementById("pk-prev").onclick = () => step(-1);
document.getElementById("pk-next").onclick = () => step(1);
document.getElementById("pk-min").onclick = () => document.getElementById("picker").classList.toggle("is-min");
addEventListener("keydown", e => {
  if (e.target.closest("input, textarea")) return;
  if (e.key === "ArrowLeft") { step(-1); e.preventDefault(); }
  if (e.key === "ArrowRight") { step(1); e.preventDefault(); }
});
(function drag(){
  const box=document.getElementById("picker"), head=document.getElementById("pk-head");
  let dx=0,dy=0,on=false;
  head.addEventListener("mousedown",e=>{
    if(e.target.closest("button"))return;
    on=true; const r=box.getBoundingClientRect();
    dx=e.clientX-r.left; dy=e.clientY-r.top;
    box.style.right="auto"; box.style.bottom="auto";
    box.style.left=r.left+"px"; box.style.top=r.top+"px"; e.preventDefault();
  });
  addEventListener("mousemove",e=>{
    if(!on)return;
    box.style.left=Math.min(Math.max(0,e.clientX-dx),innerWidth-box.offsetWidth)+"px";
    box.style.top=Math.min(Math.max(0,e.clientY-dy),innerHeight-box.offsetHeight)+"px";
  });
  addEventListener("mouseup",()=>{on=false;});
})();
render();
</script>
