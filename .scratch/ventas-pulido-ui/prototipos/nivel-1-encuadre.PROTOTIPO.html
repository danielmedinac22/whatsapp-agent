<title>Encuadre del Panel de Ventas</title>

<!--
  PROTOTIPO DESECHABLE — no es código de producción, no se integra.

  RONDA 2 · Nivel 1. El encuadre ya está elegido: marco teñido por operación
  + riel de operaciones (modelo Slack completo). Ver ## Answer del ticket.

  Lo que esta ronda decide es lo que los referentes NO zanjan:
    · hasta dónde llega el tinte dentro del cromo — Slack pinta la barra
      lateral, AWS pinta el borde superior; hay que elegir.
    · qué dos tonos, sabiendo que no pueden ser jerárquicos ni colisionar
      con menta (correcto), ámbar (atención) ni rojo (peligro).

  Los cinco llevan riel y tinte. La paleta es un control ortogonal para
  poder juzgar un eje sin que el otro contamine.

  Ronda 1 (cinco encuadres distintos): commit 2080fe6.
-->

<style>
  /* ------------------------------------------------------------------
     Tokens — de apps/web/src/app/globals.css. La menta queda LIBERADA:
     ya no identifica a Guatemala, solo significa «correcto».
     ------------------------------------------------------------------ */
  :root {
    --bg: #071119;
    --panel: rgba(10, 24, 34, 0.82);
    --panel-2: rgba(18, 35, 48, 0.9);
    --border: rgba(157, 187, 210, 0.16);
    --border-strong: rgba(157, 187, 210, 0.28);
    --text: #eff7fb;
    --text-dim: #99adbc;
    --text-soft: #6f8798;
    --accent: #6ee7b7;
    --accent-strong: #34d399;
    --highlight: #f4c16d;
    --danger: #f87171;
    --shadow-panel: 0 14px 42px rgba(3, 10, 16, 0.32);
    --font: "Avenir Next", "Segoe UI", "Helvetica Neue", system-ui, sans-serif;

    /* Identidad de la operación activa. Las inyecta render() desde la
       paleta elegida — nunca se usan para nada semántico. */
    --op: #a78bfa;
    --op-line: rgba(167, 139, 250, 0.45);
    --op-soft: rgba(167, 139, 250, 0.13);
    --op-faint: rgba(167, 139, 250, 0.07);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    background:
      linear-gradient(180deg, rgba(244, 193, 109, 0.03), transparent 28%),
      linear-gradient(180deg, #09131c 0%, #071119 45%, #050d14 100%);
    background-attachment: fixed;
    font-family: var(--font);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4 { margin: 0; font-weight: 600; }
  p { margin: 0; }
  button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; }
  :focus-visible { outline: 2px solid var(--op); outline-offset: 2px; border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }

  /* Banderas en CSS: el emoji de bandera no renderiza en todos los
     sistemas y aquí el país tiene que leerse siempre. */
  .flag {
    display: inline-block; flex: none;
    width: 22px; height: 15px; border-radius: 2px;
    border: 1px solid rgba(255, 255, 255, .18);
    box-shadow: 0 1px 3px rgba(0, 0, 0, .4);
  }
  .flag-GT { background: linear-gradient(90deg, #4997d0 0 33.3%, #fff 33.3% 66.6%, #4997d0 66.6%); }
  .flag-CO { background: linear-gradient(180deg, #fcd116 0 50%, #003893 50% 75%, #ce1126 75%); }
  .flag-lg { width: 32px; height: 22px; border-radius: 3px; }

  /* ================= piezas compartidas del mock ================= */
  .card { background: var(--panel); box-shadow: var(--shadow-panel); backdrop-filter: blur(18px); border: 1px solid var(--border); border-radius: 10px; }
  .card-muted { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; }
  .eyebrow { color: var(--highlight); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .09em; }
  .muted { color: var(--text-dim); }
  .soft { color: var(--text-soft); }

  .pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 500; white-space: nowrap; }
  .pill-accent { color: var(--accent); border-color: rgba(110,231,183,.35); background: rgba(110,231,183,.08); }
  .pill-warn   { color: var(--highlight); border-color: rgba(244,193,109,.35); background: rgba(244,193,109,.08); }
  .pill-danger { color: var(--danger); border-color: rgba(248,113,113,.35); background: rgba(248,113,113,.08); }
  .pill-quiet  { color: var(--text-soft); }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }

  .mocktable { font-size: 13px; }
  .mocktable thead th { text-align: left; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--text-soft); padding: 0 12px 8px; }
  .mocktable td { padding: 11px 12px; vertical-align: middle; border-top: 1px solid var(--border); }
  .num { font-variant-numeric: tabular-nums; }
  .prodname { font-weight: 500; letter-spacing: -.01em; }

  .empty { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 56px 24px; text-align: center; }
  .empty-mark { width: 44px; height: 44px; border-radius: 10px; border: 1px dashed var(--border-strong); display: grid; place-items: center; color: var(--text-soft); }

  /* El estado activo del menú SÍ toma el color de la operación: es cromo.
     El contenido de la derecha nunca lo toma. */
  .navlink {
    display: flex; align-items: center; gap: 9px;
    height: 34px; padding: 0 10px;
    border-radius: 8px; border: 1px solid transparent;
    color: var(--text-dim); font-size: 13px; font-weight: 500;
    background: none; width: 100%; text-align: left;
    transition: background .14s, color .14s, border-color .14s;
  }
  .navlink:hover { background: rgba(255,255,255,.045); color: var(--text); }
  .navlink[aria-current="page"] { background: var(--op-soft); border-color: var(--op-line); color: var(--text); }
  .navlink .ico { width: 15px; text-align: center; opacity: .7; font-size: 12px; }

  .grouplabel { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--text-soft); }

  .page { padding: 22px 26px 60px; max-width: 1180px; margin: 0 auto; width: 100%; }
  .page-head { display: flex; flex-direction: column; gap: 5px; margin-bottom: 20px; }
  .page-title { font-size: 21px; letter-spacing: -.015em; }
  .page-sub { color: var(--text-dim); font-size: 13px; max-width: 60ch; line-height: 1.5; }

  .statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .stat { padding: 12px 14px; }
  .stat-k { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-soft); }
  .stat-v { font-size: 19px; font-weight: 600; margin-top: 4px; letter-spacing: -.02em; }

  .convrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; padding: 13px 14px; border-top: 1px solid var(--border); align-items: start; }
  .convrow:first-of-type { border-top: none; }
  .convrow.is-open { background: rgba(110,231,183,.05); box-shadow: inset 2px 0 0 var(--accent); }
  .convrow.is-open.amb { background: rgba(244,193,109,.06); box-shadow: inset 2px 0 0 var(--highlight); }
  .convrow.is-open.esc { background: rgba(248,113,113,.06); box-shadow: inset 2px 0 0 var(--danger); }
  .convmeta { grid-column: 1 / -1; font-size: 12px; color: var(--text-soft); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  @keyframes ctxin { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .ctx-anim { animation: ctxin .3s cubic-bezier(.22,1,.36,1); }
  @keyframes railin { from { opacity: .25; transform: translateX(20px); } to { opacity: 1; transform: none; } }

  /* ================= EL ARMAZÓN COMÚN A LOS CINCO =================
     Riel de operaciones (78px) + columna de módulo (216px) + contenido.
     El anidamiento es literal: el módulo vive dentro del país elegido.
     ================================================================= */
  .shell { display: grid; grid-template-columns: 78px 216px 1fr; min-height: 100vh; }

  .rail {
    background: linear-gradient(180deg, rgba(6,14,21,.98), rgba(4,11,17,.98));
    border-right: 1px solid var(--border-strong);
    padding: 14px 11px; display: flex; flex-direction: column; gap: 10px; align-items: center;
  }
  .tile {
    width: 56px; height: 56px; border-radius: 15px;
    border: 1px solid var(--border); background: rgba(14,30,42,.7);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    position: relative; transition: all .18s cubic-bezier(.22,1,.36,1);
  }
  .tile .flag { filter: saturate(.2) brightness(.55); transition: filter .18s; }
  .tile-code { font-size: 10px; font-weight: 700; letter-spacing: .06em; color: var(--text-soft); transition: color .18s; }
  .tile:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .tile[aria-pressed="true"] { border-color: var(--op); background: var(--op-soft); box-shadow: 0 0 0 1px var(--op-line), 0 8px 20px rgba(3,10,16,.5); }
  .tile[aria-pressed="true"] .flag { filter: none; }
  .tile[aria-pressed="true"] .tile-code { color: var(--op); }
  .tile.dormant { border-style: dashed; opacity: .6; }
  /* La pestaña que sale del tile hacia la columna de módulo. */
  .tile[aria-pressed="true"]::after {
    content: ""; position: absolute; right: -12px; top: 50%; transform: translateY(-50%);
    width: 12px; height: 26px; background: var(--op-soft);
    border: 1px solid var(--op); border-left: none; border-radius: 0 6px 6px 0;
  }

  .col {
    border-right: 1px solid var(--border);
    padding: 15px 12px; display: flex; flex-direction: column; overflow: hidden;
    background: rgba(9,20,28,.72);
  }
  .col-head { display: flex; align-items: center; gap: 10px; padding: 0 4px 13px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
  .col-name { display: block; font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .col-sub  { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; margin-top: 3px; color: var(--text-soft); }

  .group { margin-bottom: 13px; }
  .group-head { display: flex; align-items: baseline; gap: 7px; padding: 0 10px 6px; }
  .group.on .group-head .grouplabel { color: var(--op); }
  .group-items { display: flex; flex-direction: column; gap: 2px; padding-left: 10px; margin-left: 9px; border-left: 1px solid var(--border); }
  .group.on .group-items { border-left-color: var(--op-line); }

  .main { min-width: 0; }
  .shell .main, .shell .col { animation: railin .32s cubic-bezier(.22,1,.36,1); }

  /* ---- R1 · Barra teñida (el modelo Slack) ---- */
  [data-r="r1"] .rail { background: linear-gradient(180deg, var(--op-faint), transparent 40%), linear-gradient(180deg, rgba(6,14,21,.98), rgba(4,11,17,.98)); }
  [data-r="r1"] .col  { background: linear-gradient(180deg, var(--op-soft), var(--op-faint) 38%, transparent 72%), rgba(9,20,28,.86); }
  [data-r="r1"] .col-head { border-bottom-color: var(--op-line); }

  /* ---- R2 · Borde superior (el modelo AWS) ---- */
  [data-r="r2"] { padding-top: 4px; }
  .aws-edge { position: fixed; top: 0; left: 0; right: 0; height: 4px; background: var(--op); z-index: 50; }
  .aws-chip {
    position: fixed; top: 4px; left: 0; z-index: 50;
    display: flex; align-items: center; gap: 8px;
    padding: 5px 13px 6px; border-radius: 0 0 9px 0;
    background: var(--op); color: #06121b;
    font-size: 12px; font-weight: 700; letter-spacing: -.005em;
  }
  [data-r="r2"] .rail { padding-top: 42px; }
  [data-r="r2"] .col  { padding-top: 42px; }

  /* ---- R3 · Solo el riel ---- */
  [data-r="r3"] .rail { border-right: 2px solid var(--op); }
  [data-r="r3"] .col  { background: rgba(9,20,28,.72); }
  [data-r="r3"] .tile[aria-pressed="true"] { background: var(--op); border-color: var(--op); }
  [data-r="r3"] .tile[aria-pressed="true"] .tile-code { color: #06121b; }
  [data-r="r3"] .tile[aria-pressed="true"]::after { background: var(--op); border-color: var(--op); }
  .modtabs { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 14px; }
  .modtab { padding: 8px 6px; border-radius: 8px; border: 1px solid var(--border); background: rgba(14,29,40,.6); color: var(--text-soft); font-size: 11.5px; font-weight: 600; transition: all .14s; }
  .modtab:hover { color: var(--text-dim); border-color: var(--border-strong); }
  .modtab[aria-pressed="true"] { background: var(--op-soft); border-color: var(--op); color: var(--op); }

  /* ---- R4 · Envolvente ---- */
  [data-r="r4"] .rail { background: linear-gradient(180deg, var(--op-faint), transparent 40%), linear-gradient(180deg, rgba(6,14,21,.98), rgba(4,11,17,.98)); }
  [data-r="r4"] .col  { background: linear-gradient(180deg, var(--op-soft), var(--op-faint) 38%, transparent 72%), rgba(9,20,28,.86); border-right: 1px solid var(--op-line); }
  [data-r="r4"] .col-head { border-bottom-color: var(--op-line); }
  [data-r="r4"] .main { border-top: 1px solid var(--op-line); box-shadow: inset 0 14px 34px -22px var(--op); }

  /* ---- R5 · Tinte + consecuencia ---- */
  [data-r="r5"] .rail { background: linear-gradient(180deg, var(--op-faint), transparent 40%), linear-gradient(180deg, rgba(6,14,21,.98), rgba(4,11,17,.98)); }
  [data-r="r5"] .col  { background: linear-gradient(180deg, var(--op-soft), var(--op-faint) 38%, transparent 72%), rgba(9,20,28,.86); }
  [data-r="r5"] .col-head { border-bottom-color: var(--op-line); }
  .conseq { padding: 10px 11px; margin-bottom: 14px; border-radius: 9px; border: 1px solid var(--op-line); background: var(--op-faint); display: flex; flex-direction: column; gap: 7px; }
  .conseq-row { display: flex; flex-direction: column; gap: 1px; }
  .conseq-k { font-size: 9px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-soft); }
  .conseq-v { font-size: 12px; font-weight: 600; color: var(--op); }
  .conseq.off { border-color: rgba(244,193,109,.4); background: rgba(244,193,109,.07); }
  .conseq.off .conseq-v { color: var(--highlight); }

  .colfoot { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); }

  /* ================= EL INSTRUMENTO =================
     Deliberadamente ajeno al sistema visual del panel, para que nadie lo
     confunda con parte del diseño que se está juzgando. Arriba de todo
     lo que las variantes ponen abajo.
     ================================================= */
  #picker {
    position: fixed; right: 16px; bottom: 16px; z-index: 9999;
    width: 288px; background: #16181c; border: 1px solid #33373f;
    border-radius: 12px; box-shadow: 0 24px 60px rgba(0,0,0,.68);
    font-size: 12px; color: #d6d9de; user-select: none; overflow: hidden;
  }
  #picker.is-min .pk-body { display: none; }
  .pk-head { display: flex; align-items: center; gap: 9px; padding: 9px 11px; background: #1e2127; border-bottom: 1px solid #33373f; cursor: grab; }
  .pk-head:active { cursor: grabbing; }
  .pk-grip { color: #6b7280; letter-spacing: 2px; font-size: 11px; }
  .pk-title { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: #8b919c; font-weight: 600; }
  .pk-min { margin-left: auto; background: none; border: none; color: #8b919c; padding: 2px 5px; border-radius: 4px; }
  .pk-min:hover { background: #2b2f36; color: #d6d9de; }
  .pk-body { padding: 10px; display: flex; flex-direction: column; gap: 9px; }
  .pk-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .pk-variant { display: flex; align-items: center; gap: 8px; }
  .pk-arrow { width: 28px; height: 30px; flex: none; border-radius: 7px; border: 1px solid #3a3f47; background: #22252b; color: #b8bdc6; font-size: 13px; line-height: 1; }
  .pk-arrow:hover { background: #2c3037; color: #fff; }
  .pk-vname { flex: 1; min-width: 0; text-align: center; }
  .pk-vnum { font-size: 9px; color: #7c828d; letter-spacing: .12em; text-transform: uppercase; }
  .pk-vlabel { font-size: 12.5px; font-weight: 600; color: #f0f2f5; margin-top: 1px; }
  .pk-vtag { font-size: 9.5px; color: #7c828d; margin-top: 2px; }
  .pk-set { display: flex; flex-direction: column; gap: 5px; }
  .pk-legend { font-size: 9px; text-transform: uppercase; letter-spacing: .11em; color: #7c828d; font-weight: 600; }
  .pk-opts { display: flex; gap: 4px; flex-wrap: wrap; }
  .pk-opt { flex: 1 1 0; min-width: 0; padding: 6px 8px; border-radius: 6px; border: 1px solid #3a3f47; background: #22252b; color: #9aa0aa; font-size: 11px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pk-opt:hover { background: #2c3037; color: #e3e6ea; }
  .pk-opt[aria-pressed="true"] { background: #2f5d4f; border-color: #4b9c81; color: #b8f5dc; }
  .pk-swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .pk-hint { font-size: 10px; color: #6b7280; line-height: 1.45; border-top: 1px solid #2b2f36; padding-top: 9px; }
  .pk-hint kbd { background: #2b2f36; border: 1px solid #3f444c; border-radius: 3px; padding: 0 4px; font-family: inherit; font-size: 9.5px; color: #b8bdc6; }
</style>

<script>
/* ====================================================================
   DATOS — reales, de la operación de Vorare. Los cuatro nombres casi
   homónimos de REVITALHAIR son el problema que el diseño debe dejar ver.
   ==================================================================== */

const PALETTES = [
  { key: "vc", label: "Violeta / Cian",  GT: "#a78bfa", CO: "#38bdf8" },
  { key: "cr", label: "Cian / Rosa",     GT: "#38bdf8", CO: "#f472b6" },
  { key: "vr", label: "Violeta / Rosa",  GT: "#a78bfa", CO: "#f472b6" },
];

const OPS = {
  GT: { code: "GT", name: "Guatemala", currency: "GTQ", currencyLong: "quetzales (GTQ)",
        phone: "+502 3689 0343", store: "Vorare GT · Shopify", live: true, status: "Operando",
        orders: "1.678", confirm: "88,4%", monthly: "~470 / mes", products: "17" },
  CO: { code: "CO", name: "Colombia", currency: "COP", currencyLong: "pesos (COP)",
        phone: "+57 304 5430173", store: "sin conectar", live: false, status: "Sin operar",
        orders: "0", confirm: "—", monthly: "—", products: "0" },

const MODULES = {
  ventas: { key: "ventas", label: "Ventas", agent: "Sebastián", role: "preventa",
    screens: [{ key: "catalogo", label: "Catálogo", icon: "▤" },
              { key: "conversaciones", label: "Conversaciones", icon: "◇" },
              { key: "vendedor", label: "Vendedor", icon: "◉" }] },

/* hex → rgba, para derivar los lavados del color de la operación. */
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}

/* ---------------- ARMAZÓN COMÚN ---------------- */

function navFor(m) {
  const box = el("div");
  box.style.cssText = "display:flex;flex-direction:column;gap:2px";
  MODULES[m].screens.forEach((s) => {
    const b = el("button", "navlink", `<span class="ico">${s.icon}</span>${esc(s.label)}`);
    if (state.screen === s.key && state.module === m) b.setAttribute("aria-current", "page");
    b.onclick = () => { state.module = m; state.screen = s.key; render(); };
    box.appendChild(b);
  });
  return box;
}

function buildRail() {
  const rail = el("div", "rail");
  Object.values(OPS).forEach((x) => {
    const t = el("button", "tile" + (x.live ? "" : " dormant"), `${flag(x.code)}<span class="tile-code">${esc(x.code)}</span>`);
    t.setAttribute("aria-pressed", String(state.country === x.code));
    t.title = `${x.name} · ${x.status}`;
    t.onclick = () => { state.country = x.code; render(); };
    rail.appendChild(t);
  });
  const add = el("button", "tile", `<span style="color:var(--text-soft);font-size:19px;line-height:1">+</span>`);
  add.style.opacity = ".4";
  add.title = "Las operaciones se dan de alta por configuración, no desde el panel";
  rail.appendChild(add);
  return rail;
}

/* Los grupos de módulo — el anidamiento dentro del país. */
function buildGroups() {
  const box = el("div");
  ["ventas", "confirmacion"].forEach((k) => {
    const m = MODULES[k];
    const g = el("div", "group" + (state.module === k ? " on" : ""));

      <span class="soft" style="font-size:11px">${esc(m.agent)}</span>`));
    const items = el("div", "group-items");
    items.appendChild(navFor(k));

}

/* R3 pone el módulo como pestañas en vez de grupos: es la variante que
   mantiene el color dentro del riel, y necesita otra señal de anidamiento. */
function buildModTabs() {
  const tabs = el("div", "modtabs");
  ["ventas", "confirmacion"].forEach((k) => {
    const m = MODULES[k];

    b.title = `${m.label} · ${m.role}`;
    b.onclick = () => { state.module = k; state.screen = m.screens[0].key; render(); };
    tabs.appendChild(b);

function buildShell(variantId) {
  const frag = document.createDocumentFragment();
  const shell = el("div", "shell");
  shell.setAttribute("data-r", variantId);

  shell.appendChild(buildRail());

  const col = el("div", "col");
  col.appendChild(colHead());

  // R5 mete la consecuencia junto al color: el tinte no va solo.
  if (variantId === "r5") {
    const o = op();
    const c = el("div", "conseq" + (o.live ? "" : " off"));
    c.innerHTML = o.live
      ? `<div class="conseq-row"><span class="conseq-k">Vas a escribir desde</span><span class="conseq-v num">${esc(o.phone)}</span></div>
         <div class="conseq-row"><span class="conseq-k">Vas a cobrar en</span><span class="conseq-v">${esc(o.currencyLong)}</span></div>`
      : `<div class="conseq-row"><span class="conseq-k">Nada sale de aquí</span><span class="conseq-v">la operación no está activa</span></div>
         <div class="conseq-row"><span class="conseq-k">Número</span><span class="conseq-v num">${esc(o.phone)}</span></div>`;
    col.appendChild(c);
  }

  col.appendChild(variantId === "r3" ? buildModTabs() : buildGroups());
  if (variantId === "r3") col.appendChild(navFor(state.module));
  col.appendChild(colFoot());
  shell.appendChild(col);

  const main = el("div", "main");
  const page = el("div", "page ctx-anim");
  page.appendChild(content());
  main.appendChild(page);
  shell.appendChild(main);

  // R2 pinta el borde superior sobre todo, como la consola de AWS.
  if (variantId === "r2") {
    const o = op();
    frag.appendChild(el("div", "aws-edge"));
    frag.appendChild(el("div", "aws-chip ctx-anim", `${flag(o.code)}${esc(o.name)}`));
  }

  frag.appendChild(shell);
  return frag;
}

function render() {
  const v = VARIANTS[state.variant];
  const p = pal();
  const hex = p[state.country];

  const root = document.documentElement.style;
  root.setProperty("--op", hex);
  root.setProperty("--op-line", rgba(hex, 0.45));
  root.setProperty("--op-soft", rgba(hex, 0.13));
  root.setProperty("--op-faint", rgba(hex, 0.07));

  if (!mod().screens.some((s) => s.key === state.screen)) state.screen = mod().screens[0].key;

  const app = document.getElementById("app");
  app.innerHTML = "";
  app.appendChild(buildShell(v.id));
  syncPicker();
}

/* ---------------------- El instrumento ---------------------- */

function syncPicker() {
  const v = VARIANTS[state.variant];
  document.getElementById("pk-vnum").textContent = `${state.variant + 1} de 5`;
  document.getElementById("pk-vlabel").textContent = v.label;
  document.getElementById("pk-vtag").textContent = v.tag;

  const pbox = document.getElementById("pk-palette");
  pbox.innerHTML = "";
  PALETTES.forEach((p) => {
    const b = el("button", "pk-opt",
      `<span class="pk-swatch" style="background:${p.GT}"></span><span class="pk-swatch" style="background:${p.CO};margin-left:-3px"></span>`);
    b.title = p.label;
    b.setAttribute("aria-pressed", String(state.palette === p.key));
    b.onclick = () => { state.palette = p.key; render(); };
    pbox.appendChild(b);
  });

  const screens = document.querySelector('[data-key="screen"]');
  screens.innerHTML = "";
  mod().screens.forEach((s) => {
    const b = el("button", "pk-opt", esc(s.label));
    b.setAttribute("aria-pressed", String(state.screen === s.key));
    b.onclick = () => { state.screen = s.key; render(); };
    screens.appendChild(b);
  });

  document.querySelectorAll(".pk-opts[data-key]").forEach((g) => {
    const key = g.dataset.key;
    if (key === "screen" || key === "palette") return;
    g.querySelectorAll(".pk-opt").forEach((b) => b.setAttribute("aria-pressed", String(state[key] === b.dataset.val)));
  });
}

document.querySelectorAll('.pk-opts[data-key]').forEach((g) => {
  const key = g.dataset.key;
  if (key === "screen" || key === "palette") return;
  g.querySelectorAll(".pk-opt").forEach((b) => {
    b.onclick = () => {
      state[key] = b.dataset.val;
      if (key === "module") state.screen = MODULES[b.dataset.val].screens[0].key;
      if (key === "conv" && state.module === "ventas") state.screen = "conversaciones";
      if ((key === "catalog" || key === "ads") && state.module === "ventas") state.screen = "catalogo";
      render();
    };
  });
});

function step(d) { state.variant = (state.variant + d + VARIANTS.length) % VARIANTS.length; render(); }
document.getElementById("pk-prev").onclick = () => step(-1);
document.getElementById("pk-next").onclick = () => step(1);
document.getElementById("pk-min").onclick = () => document.getElementById("picker").classList.toggle("is-min");

addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea")) return;
  if (e.key === "ArrowLeft") { step(-1); e.preventDefault(); }
  if (e.key === "ArrowRight") { step(1); e.preventDefault(); }
});

/* Arrastrable: el instrumento no puede tapar la esquina que se juzga. */
(function drag() {
  const box = document.getElementById("picker"), head = document.getElementById("pk-head");
  let dx = 0, dy = 0, on = false;
  head.addEventListener("mousedown", (e) => {
    if (e.target.closest("button")) return;
    on = true;
    const r = box.getBoundingClientRect();
    dx = e.clientX - r.left; dy = e.clientY - r.top;
    box.style.right = "auto"; box.style.bottom = "auto";
    box.style.left = r.left + "px"; box.style.top = r.top + "px";
    e.preventDefault();
  });
  addEventListener("mousemove", (e) => {
    if (!on) return;
    const w = box.offsetWidth, h = box.offsetHeight;
    box.style.left = Math.min(Math.max(0, e.clientX - dx), innerWidth - w) + "px";
    box.style.top = Math.min(Math.max(0, e.clientY - dy), innerHeight - h) + "px";
  });
  addEventListener("mouseup", () => { on = false; });
})();

render();
</script>
