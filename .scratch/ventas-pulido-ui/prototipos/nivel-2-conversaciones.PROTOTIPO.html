<title>Bandeja de ventas</title>

<!--
  PROTOTIPO DESECHABLE — no es código de producción, no se integra.

  NIVEL 2 · grupo «conversaciones». El encuadre del nivel 1 está CERRADO y
  aquí va fijo: riel de operaciones que tiñe la barra, módulo anidado dentro,
  colapsable a 46px. Lo único que varía entre las cinco variantes es la
  pantalla de conversaciones de ventas.

  La pregunta: qué forma tiene la bandeja de ventas y qué relación tiene con
  el Inbox que ya existe. El spec de Panel dice que es la pieza con más rango
  de esfuerzo del proyecto entero.

  Hechos del código que enmarcan la pregunta:
  · conversations.operation_id YA existe (schema.ts:414) — se puede filtrar
    por país sin construir nada.
  · listConversations (queries.ts:104) hoy NO filtra por nada: el Inbox
    mezclaría los dos países el día que Colombia reciba un mensaje.
  · No hay columna de dueño (sales/owner.ts): Katherine/Sebastián se DERIVA.
  · conversations.assigned_user_id sí existe.

  Y una distinción del ticket que no se puede aplastar:
    TOMAR EL CHAT  = pausar al vendedor en esa conversación
    ASIGNARSE      = «la estoy trabajando yo» (assigned_user_id)
  Son independientes: se puede estar asignado sin haber pausado a Sebastián.

  Nivel 1 cerrado en eee80a0.
-->

<script>
/* ====================================================================
   DATOS — la operación real de Vorare.
   ==================================================================== */

const OPS = {
  GT: { code:"GT", name:"Guatemala", currency:"GTQ", phone:"+502 3689 0343",
        store:"Vorare GT · Shopify", live:true, status:"Operando", accent:"#a78bfa" },
  CO: { code:"CO", name:"Colombia", currency:"COP", phone:"+57 304 5430173",
        store:"sin conectar", live:false, status:"Sin operar", accent:"#38bdf8" },
};

const MODULES = {
  ventas: { key:"ventas", label:"Ventas", agent:"Sebastián",
    screens:[{key:"conversaciones",label:"Conversaciones",icon:"◇"},
             {key:"catalogo",label:"Catálogo",icon:"▤"},
             {key:"vendedor",label:"Vendedor",icon:"◉"}] },

    screens:[{key:"inbox",label:"Inbox",icon:"✉"},
             {key:"pedidos",label:"Pedidos",icon:"▦"},
             {key:"plantillas",label:"Plantillas",icon:"▥"}] },

/* `taken` = el vendedor está pausado en esa conversación.
   `mine`  = assigned_user_id. Son independientes, y el prototipo tiene una
   fila que lo demuestra: Silvia está asignada SIN pausar a Sebastián. */
const CHATS = {
  GT: [
    { id:"c1", who:"Ana Sicán", tel:"+502 3390 5518", when:"hace 26 min", rec:"esc",
      prev:"«Quiero hablar con una persona por favor»", unread:3,
      prod:"REVITALHAIR – DHT ANTICALVICIE", ad:"23851094782", adName:"DHT · antes y después",
      taken:false, mine:false, note:"Sebastián escaló tras dos intentos" },
    { id:"c2", who:"Luis Ovalle", tel:"+502 4471 2093", when:"hace 12 min", rec:"amb",

const REC = {
  ok:  { label:"producto reconocido",     cls:"pill-ok",  lane:"Reconocidas" },
  amb: { label:"reconocimiento ambiguo",  cls:"pill-amb", lane:"Ambiguas" },

/* ==================================================================== */

const state = { variant:0, load:"busy", country:"GT", module:"ventas",
                screen:"conversaciones", bars:"open", sel:"c1" };

const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const flag=(c,s)=>`<span class="flag flag-${c}${s?" flag-"+s:""}"></span>`;
const op=()=>OPS[state.country];
const mod=()=>MODULES[state.module];
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255}, ${(n>>8)&255}, ${n&255}, ${a})`;}

/* La bandeja según el estado elegido. «Todo en orden» es el estado feliz:
   sirve para ver que con él las cinco variantes se parecen demasiado. */
function chats() {
  if (state.load === "empty") return [];
  const all = CHATS[state.country];
  if (state.load === "calm") return all.filter(c => c.rec === "ok");
  return all;
}
const sel = () => chats().find(c => c.id === state.sel) || chats()[0] || null;

/* ---------------- piezas ---------------- */

const recPill = r => `<span class="pill ${REC[r].cls}">${REC[r].label}</span>`;
const stateMarks = c => `${c.taken ? `<span class="pill mk-paused">vendedor pausado</span>` : ""}${c.mine ? `<span class="pill mk-mine">mía</span>` : ""}`;

function prodLine(c) {
  return c.prod
    ? `<span class="prod"><strong>${esc(c.prod)}</strong> · anuncio ${esc(c.ad)}</span>`
    : `<span class="prod soft">sin producto reconocido · ${esc(c.adName)}</span>`;
}

function chatRow(c, opts = {}) {
  const b = el("button", `row row-${c.rec}` + (sel() && sel().id === c.id ? " sel" : ""));
  b.innerHTML = `
    <div style="min-width:0">
      <div class="who">${esc(c.who)}${c.unread ? ` <span class="pill pill-op num" style="padding:1px 6px">${c.unread}</span>` : ""}</div>
      <div class="prev">${esc(c.prev)}</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
      ${opts.hideRec ? "" : recPill(c.rec)}
      <span class="when">${esc(c.when)}</span>
    </div>
    <div class="rowline meta">${prodLine(c)}${stateMarks(c) ? " " + stateMarks(c) : ""}</div>`;
  b.onclick = () => { state.sel = c.id; render(); };
  return b;
}

function emptyBox(msg, sub) {
  const c = el("div", "card");
  c.appendChild(el("div", "empty", `<div class="empty-mark">◇</div>
    <h3 style="font-size:15px">${esc(msg)}</h3>
    <p class="soft" style="max-width:44ch;font-size:12.5px;line-height:1.55">${esc(sub)}</p>`));
  return c;
}

/* El hilo, con el contexto de venta arriba y los dos controles abajo.
   Tomar el chat y asignarse son botones distintos: no son el mismo acto. */
function threadPanel() {
  const c = sel();
  const box = el("div", "card thread");
  if (!c) { box.appendChild(el("div", "empty", `<div class="empty-mark">◇</div>
    <p class="soft" style="font-size:12.5px">Elegí una conversación</p>`)); return box; }

  const head = el("div", "th-head");
  head.innerHTML = `<div style="flex:1;min-width:0">
      <div class="who">${esc(c.who)}</div>
      <div class="meta num" style="margin-top:3px">${esc(c.tel)}</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">${recPill(c.rec)}${stateMarks(c)}</div>`;
  box.appendChild(head);

  const ctx = el("div", "th-ctx");
  ctx.innerHTML = `
    <div><div class="th-ctx-k">Producto reconocido</div>
      <div class="th-ctx-v">${c.prod ? esc(c.prod) : `<span class="soft">ninguno todavía</span>`}</div></div>
    <div><div class="th-ctx-k">Vino del anuncio</div>
      <div class="th-ctx-v num">${c.ad ? esc(c.ad) : `<span class="soft">sin referencia</span>`}</div></div>
    <div><div class="th-ctx-k">Campaña</div><div class="th-ctx-v">${esc(c.adName)}</div></div>`;
  box.appendChild(ctx);

  const body = el("div", "th-body");
  body.innerHTML = `
    <div class="bub bub-in">${esc(c.prev)}</div>
    ${c.rec === "amb"
      ? `<div class="bub bub-out">Con gusto. ¿Te interesa el tratamiento en cápsulas, el bloqueador o el combo con serum?</div>
         <div class="bub bub-note">${esc(c.note || "")}</div>`
      : c.rec === "esc"
      ? `<div class="bub bub-out">Entiendo, ya paso tu caso con una persona del equipo.</div>
         <div class="bub bub-note">${esc(c.note || "")}</div>`
      : `<div class="bub bub-out">Sí, funciona muy bien para entradas. El tratamiento son 3 meses.</div>`}
    ${c.taken ? `<div class="bub bub-note">${esc(c.note || "")}</div>` : ""}`;
  box.appendChild(body);

  const foot = el("div", "th-foot");
  const composer = el("div", "composer", c.taken ? "Escribí — Sebastián está pausado aquí" : "Sebastián está respondiendo…");
  const take = el("button", "btn" + (c.taken ? " btn-hot" : ""), c.taken ? "Devolver a Sebastián" : "Tomar el chat");
  take.title = c.taken ? "Reactiva al vendedor en esta conversación" : "Pausa al vendedor solo en esta conversación";
  take.onclick = () => { c.taken = !c.taken; render(); };
  const assign = el("button", "btn", c.mine ? "Soltar" : "Asignarme");
  assign.title = "Independiente de tomar el chat: marca quién la está trabajando";
  assign.onclick = () => { c.mine = !c.mine; render(); };
  foot.appendChild(composer); foot.appendChild(take); foot.appendChild(assign);
  box.appendChild(foot);
  return box;
}

function moduleSeg() {
  const seg = el("div", "seg");
  [["all","Todas"],["confirmacion","Katherine"],["ventas","Sebastián"]].forEach(([k, lbl]) => {
    const b = el("button", "segbtn", lbl);
    b.setAttribute("aria-pressed", String(k === "ventas"));
    seg.appendChild(b);
  });
  return seg;
}

/* V3 · No es una bandeja: es una cola ordenada por quién necesita un humano.

function convV3() {
  const list = chats(), wrap = el("div");

    <span class="eyebrow">${esc(op().name)} · conversaciones</span>
    <h2 class="page-title">Cola de ventas</h2>
    <p class="page-sub">Ordenada por quién necesita un humano. Lo que va bien se pliega: si Sebastián lo está resolviendo, no es trabajo tuyo.</p>`));

  const two = el("div", "two");

  [["esc", "Necesitan un humano", "var(--danger)"], ["amb", "Reconocimiento dudoso", "var(--highlight)"]].forEach(([k, title, color]) => {

/* V5 · La campaña al frente: filas agrupadas por el anuncio que las trajo. */
function convV5() {
  const list = chats(), wrap = el("div");
  wrap.appendChild(el("div", "page-head", `
    <span class="eyebrow">${esc(op().name)} · conversaciones</span>
    <h2 class="page-title">Conversaciones por anuncio</h2>
    <p class="page-sub">Agrupadas por la campaña que las trajo. Las que llegaron sin referencia quedan arriba, porque son las que hay que registrar.</p>`));
  if (!list.length) { wrap.appendChild(emptyBox("Sin conversaciones", `El número ${op().phone} todavía no recibe leads de anuncios.`)); return wrap; }

  const groups = new Map();
  list.forEach(c => {
    const k = c.ad || "__none";
    if (!groups.has(k)) groups.set(k, { ad: c.ad, name: c.adName, prod: c.prod, rows: [] });
    groups.get(k).rows.push(c);
  });
  const ordered = [...groups.values()].sort((a, b) => (a.ad ? 1 : 0) - (b.ad ? 1 : 0));

  const two = el("div", "two");
  const card = el("div", "card");
  card.style.overflow = "hidden";
  ordered.forEach(g => {
    const box = el("div", "adgroup");
    const h = el("div", "adhead");
    h.innerHTML = g.ad
      ? `<span class="dot" style="background:var(--op)"></span>
         <span><span class="adname">${esc(g.name)}</span>
         <span class="adid" style="display:block;margin-top:2px">anuncio ${esc(g.ad)} → ${esc(g.prod || "")}</span></span>
         <span class="count">${g.rows.length}</span>`
      : `<span class="dot" style="background:var(--highlight)"></span>
         <span><span class="adname" style="color:var(--highlight)">Sin anuncio en el mensaje</span>
         <span class="adid" style="display:block;margin-top:2px">llegaron por orgánico o el anuncio no está registrado</span></span>
         <span class="count">${g.rows.length}</span>`;
    box.appendChild(h);
    g.rows.forEach(c => box.appendChild(chatRow(c, { hideRec: false })));
    card.appendChild(box);
  });
  two.appendChild(card); two.appendChild(threadPanel());
  wrap.appendChild(two);
  return wrap;
}

/* ---------------- armazón (nivel 1, cerrado) ---------------- */

const toggleBars = () => { state.bars = state.bars === "open" ? "collapsed" : "open"; render(); };
function switchCountry(code) {
  if (state.country === code) return;
  state.country = code; state.bars = "open";
  state.sel = (CHATS[code][0] || {}).id;
  render();
}

function navFor(m) {
  const box = el("div");
  box.style.cssText = "display:flex;flex-direction:column;gap:2px";
  MODULES[m].screens.forEach(s => {
    const b = el("button", "navlink", `<span class="ico">${s.icon}</span>${esc(s.label)}`);
    if (state.screen === s.key && state.module === m) b.setAttribute("aria-current", "page");
    b.onclick = () => { state.module = m; state.screen = s.key; render(); };
    box.appendChild(b);
  });
  return box;
}

function buildRail(tight) {
  const rail = el("div", "rail" + (tight ? " tight" : ""));
  Object.values(OPS).forEach(x => {
    const t = el("button", "tile" + (x.live ? "" : " dormant"),
      `${flag(x.code)}${tight ? "" : `<span class="tile-code">${esc(x.code)}</span>`}`);
    t.setAttribute("aria-pressed", String(state.country === x.code));
    t.title = `${x.name} · ${x.status}`;
    t.onclick = () => switchCountry(x.code);
    rail.appendChild(t);
  });
  if (tight) {
    const sep = el("div");
    sep.style.cssText = "width:20px;height:1px;background:var(--border);margin:3px 0";
    rail.appendChild(sep);
    mod().screens.forEach(s => {
      const b = el("button", "strip-ico", s.icon);
      b.title = `${mod().label} · ${s.label}`;
      if (state.screen === s.key) b.setAttribute("aria-current", "page");
      b.onclick = () => { state.screen = s.key; render(); };
      rail.appendChild(b);
    });
  }
  const f = el("button", "fold", state.bars === "open" ? "«" : "»");
  f.style.marginTop = "auto";
  f.onclick = toggleBars;
  rail.appendChild(f);
  return rail;
}

function buildCol() {
  const o = op(), col = el("div", "col");
  const head = el("div", "col-head");
  head.innerHTML = `${flag(o.code, "lg")}
    <span style="min-width:0"><span class="col-name">${esc(o.name)}</span>
      <span class="col-sub">${esc(o.status)} · ${esc(o.currency)}</span>
      <span class="col-tel${o.live ? "" : " off"}">${esc(o.phone)}</span></span>`;
  const f = el("button", "fold", "«");
  f.onclick = toggleBars;
  head.appendChild(f);
  col.appendChild(head);
  ["ventas", "confirmacion"].forEach(k => {
    const m = MODULES[k];
    const g = el("div", "group" + (state.module === k ? " on" : ""));
    g.appendChild(el("div", "group-head", `<span class="grouplabel">${esc(m.label)}</span>
      <span class="soft" style="font-size:11px">${esc(m.agent)}</span>`));
    const items = el("div", "group-items");
    items.appendChild(navFor(k));
    g.appendChild(items);
    col.appendChild(g);
  });
  col.appendChild(el("div", "colfoot", `<div class="soft" style="font-size:11px;line-height:1.5">${esc(o.store)}</div>`));
  return col;
}

function render() {
  const hex = op().accent;
  const root = document.documentElement.style;
  root.setProperty("--op", hex);
  root.setProperty("--op-line", rgba(hex, .45));
  root.setProperty("--op-soft", rgba(hex, .13));
  root.setProperty("--op-faint", rgba(hex, .07));

  if (!mod().screens.some(s => s.key === state.screen)) state.screen = mod().screens[0].key;
  const cs = chats();
  if (!cs.some(c => c.id === state.sel)) state.sel = (cs[0] || {}).id;

  const shell = el("div", "shell");
  const open = state.bars === "open";
  shell.style.gridTemplateColumns = open ? "78px 216px 1fr" : "46px 1fr";
  shell.appendChild(buildRail(!open));
  if (open) shell.appendChild(buildCol());
  const main = el("div", "main");
  const page = el("div", "page");
  page.appendChild(content());
  main.appendChild(page);
  shell.appendChild(main);

  const app = document.getElementById("app");
  app.innerHTML = "";
  app.appendChild(shell);
  syncPicker();
}

/* ---------------------- el instrumento ---------------------- */

function syncPicker() {
  const v = VARIANTS[state.variant];
  document.getElementById("pk-vnum").textContent = `${state.variant + 1} de 5`;
  document.getElementById("pk-vlabel").textContent = v.label;
  document.getElementById("pk-vtag").textContent = v.tag;

  const box = document.querySelector('[data-key="sel"]');
  box.innerHTML = "";
  const cs = chats();
  if (!cs.length) box.appendChild(el("span", "soft", `<span style="font-size:11px">bandeja vacía</span>`));
  cs.slice(0, 4).forEach(c => {
    const b = el("button", "pk-opt", esc(c.who.split(" ")[0]));
    b.title = `${c.who} · ${REC[c.rec].label}`;
    b.setAttribute("aria-pressed", String(state.sel === c.id));
    b.onclick = () => { state.sel = c.id; render(); };
    box.appendChild(b);
  });

  document.querySelectorAll(".pk-opts[data-key]").forEach(g => {
    if (g.dataset.key === "sel") return;
    g.querySelectorAll(".pk-opt").forEach(b =>
      b.setAttribute("aria-pressed", String(state[g.dataset.key] === b.dataset.val)));
  });
}

document.querySelectorAll('.pk-opts[data-key]').forEach(g => {
  if (g.dataset.key === "sel") return;
  g.querySelectorAll(".pk-opt").forEach(b => {
    b.onclick = () => {
      const k = g.dataset.key;
      if (k === "country") { switchCountry(b.dataset.val); return; }
      state[k] = b.dataset.val;
      if (k === "module") state.screen = MODULES[b.dataset.val].screens[0].key;
      render();
    };
  });
});

function step(d) { state.variant = (state.variant + d + VARIANTS.length) % VARIANTS.length; render(); }
document.getElementById("pk-prev").onclick = () => step(-1);
document.getElementById("pk-next").onclick = () => step(1);
document.getElementById("pk-min").onclick = () => document.getElementById("picker").classList.toggle("is-min");
addEventListener("keydown", e => {
  if (e.target.closest("input, textarea")) return;
  if (e.key === "ArrowLeft") { step(-1); e.preventDefault(); }
  if (e.key === "ArrowRight") { step(1); e.preventDefault(); }
});

(function drag() {
  const box = document.getElementById("picker"), head = document.getElementById("pk-head");
  let dx = 0, dy = 0, on = false;
  head.addEventListener("mousedown", e => {
    if (e.target.closest("button")) return;
    on = true;
    const r = box.getBoundingClientRect();
    dx = e.clientX - r.left; dy = e.clientY - r.top;
    box.style.right = "auto"; box.style.bottom = "auto";
    box.style.left = r.left + "px"; box.style.top = r.top + "px";
    e.preventDefault();
  });
  addEventListener("mousemove", e => {
    if (!on) return;
    box.style.left = Math.min(Math.max(0, e.clientX - dx), innerWidth - box.offsetWidth) + "px";
    box.style.top = Math.min(Math.max(0, e.clientY - dy), innerHeight - box.offsetHeight) + "px";
  });
  addEventListener("mouseup", () => { on = false; });
})();

render();
</script>
